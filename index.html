<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kids Education</title>
    <link rel="stylesheet" href="./style/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body class="quicksand-fonts">
    <header>
      <div class="mobile-navbar">
        <a href="#" class="mobile-logo">
          <img src="./assets/logo.png" alt="School Logo" />
        </a>
        <div class="humburger-menu">
            <i class="fa-solid fa-bars"></i>
        </div>
      </div>

      <!-- Destop View -->
      <nav class="navbar">
        <div class="edu-info">
          <img src="./assets/logo.png" alt="School Logo" class="logo-img" />
          <h1>SCHOOL</h1>
        </div>

        <ul class="nav-links">
          <li><a href="#" class="nav-link home">Home</a></li>
          <li><a href="#" class="nav-link about">About</a></li>
          <li><a href="#" class="nav-link facilities">Facilities</a></li>
          <li><a href="#" class="nav-link admission">Admission</a></li>
        </ul>

        <div class="contact-action">
          <a href="#" class="contact-btn">Contact</a>
        </div>
      </nav>

      <div class="hero">
        <div class="hero-title">
          <div class="hero-heading">
            <h1>
              <span class="orange">Empowering</span><br />students from small
              <br />age <span class="aqua">towards vision</span>
            </h1>
          </div>
          <div class="hero-subtitle">
            <p>
              With the courage, Confidence, Creativity and Compassion to make
              their Unique Contribution in a Diverse and Dynamic World.
            </p>
          </div>
          <button class="btn-primary Enroll">Enroll Now</button>
        </div>
        <div class="hero-img">
          <img src="./assets/hero-kids.png" alt="" />
        </div>
      </div>
    </header>

    <main></main>
    <footer></footer>
  </body>
</html>
